name: 'release'

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  tag:
    if: github.event_name == 'push'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' packages/airport/pull/package.json) && git push --tags"
      - name: 'Create a GitHub release'
        run: "gh release create $(jq -r '.version' packages/airport/pull/package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    needs: 'tag'
    if: github.ref == 'refs/heads/main' && !failure() && !cancelled()
    runs-on: 'ubuntu-latest'
    environment: 'production'
    timeout-minutes: 30
    concurrency:
      group: 'infra-production'
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Set up Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 'Bundle the function'
        working-directory: 'packages/airport/pull'
        run: 'npm ci --no-audit --no-fund && npm run bundle'
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 'Set up OpenTofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: 'infra/.opentofu-version'
          tofu_wrapper: false
      - name: 'Initialize OpenTofu'
        run: 'tofu -chdir=infra init -input=false'
      - name: 'Plan infrastructure changes'
        run: 'tofu -chdir=infra plan -input=false -lock-timeout=10m -out=tfplan'
      - name: 'Report the plan'
        continue-on-error: true
        uses: gi-org-pl/report-tofu-plan-action@3e9723344bbd1c09659e14bf34be192d8db84213 # v1.0.1
        with:
          working-directory: 'infra'
      - name: 'Apply infrastructure changes'
        run: 'tofu -chdir=infra apply -input=false -lock-timeout=10m tfplan'
