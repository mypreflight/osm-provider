name: 'integrity'

on:
  pull_request:
    paths: ['**', '!**.md']

jobs:
  code:
    runs-on: 'ubuntu-24.04'
    environment: ci
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: 'Set up Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
          cache: 'npm'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Run code formatting check'
        run: 'npm run format'
      - name: 'Run static code analysis'
        run: 'npm run lint'
      - name: 'Run type check'
        run: 'npm run typecheck'
      - name: 'Run unit tests'
        run: 'npm test'
      - name: 'Build deployable functions'
        run: 'npm run build:functions'
