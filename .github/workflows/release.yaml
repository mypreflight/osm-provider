name: 'release'

on:
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  tag:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Release and push git tag'
        run: "git tag $(jq -r '.version' packages/airport/pull/package.json) && git push --tags"
      - name: 'Create a GitHub release'
        run: "gh release create $(jq -r '.version' packages/airport/pull/package.json) --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
