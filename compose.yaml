services:
  app:
    build:
      context: .
      target: development
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - '3003:3000'
    healthcheck:
      test: 'curl --fail http://localhost:3000/health || exit 1'
      interval: 500ms
      retries: 3600
      start_period: 3s
      timeout: 500ms

  overpass-mock:
    image: mockserver/mockserver:mockserver-9.3.0@sha256:6cc3ca2bef67e04e618fc2732e6c9569b39651ce2a194fce4f239b398c232437
    ports:
      - '1181:1080'
    volumes:
      - ./docker/mock:/config
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/overpass.json
