name: 'integrity'

on:
  pull_request:
    paths: ['**', '!**.md']

jobs:
  files:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
      - name: 'Check for CRLF line endings'
        uses: 'gi-org-pl/check-crlf-action@v1'
      - name: 'Check for file permission changes'
        uses: 'gi-org-pl/check-file-permissions-action@v1'
      - name: 'Check app version is unique'
        uses: 'gi-org-pl/check-version-action@v1'
        with:
          version: "$(jq -r '.version' package.json)"
  code:
    runs-on: 'ubuntu-24.04'
    environment: ci
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v6'
      - name: 'Set up Node'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '24'
          cache: 'npm'
      - name: 'Install dependencies'
        run: 'npm ci'
      - name: 'Run code formatting check'
        run: 'npm run format'
      - name: 'Run static code analysis'
        run: 'npm run lint'
      - name: 'Run type check'
        run: 'npm run typecheck'
      - name: 'Run unit tests'
        run: 'npm test'
      - name: 'Build deployable functions'
        run: 'npm run build:functions'
