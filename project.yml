targetNamespace: ''
parameters: {}
environment: {}
packages:
  - name: airport
    environment:
      OSM_FUNCTION_SECRET: '${OSM_FUNCTION_SECRET}'
    functions:
      - name: pull
        runtime: 'nodejs:24'
        main: main
        web: true
        webSecure: '${OSM_FUNCTION_SECRET}'
        limits:
          # The platform default is 3s. A cold Overpass query for a major hub
          # measures ~12s on a good day, and the client's retry budget
          # (client.ts, asserted by client.spec.ts) has to fit inside this.
          timeout: 300000
          # A raw "out geom" response for a big hub is tens of megabytes.
          memory: 512
