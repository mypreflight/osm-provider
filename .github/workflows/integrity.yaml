name: 'integrity'

on:
  pull_request:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Check for CRLF line endings'
        uses: gi-org-pl/check-crlf-action@464995c09f1659cd4b0f7e2bf7234994f0fd705e # v1.0.2
      - name: 'Check for file permission changes'
        uses: gi-org-pl/check-file-permissions-action@1cec1b07fa817da3da98bd2da20992365d6b4da6 # v1.0.0
      - name: 'Check pull version is unique'
        uses: gi-org-pl/check-version-action@c884d1e92d3eef7b26d6277d49f18d0803009d73 # v1.0.0
        with:
          version: "$(jq -r '.version' packages/airport/pull/package.json)"
  code:
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        function: ['pull']
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Copy environment variables'
        run: 'cp .env.dist .env'
      - name: 'Run docker compose environment'
        run: docker compose up -d --build --wait
      - name: 'Run static code analysis'
        run: docker compose exec ${{ matrix.function }} npm run lint
      - name: 'Run type check'
        run: docker compose exec ${{ matrix.function }} npm run typecheck
      - name: 'Run unit tests'
        run: docker compose exec ${{ matrix.function }} npm test
      - name: 'Run functional tests'
        run: docker compose exec ${{ matrix.function }} npm run test:functional
      - name: 'Build the function the way DigitalOcean does'
        run: |
          docker compose exec ${{ matrix.function }} sh -c '
            rm -rf /tmp/slice && mkdir -p /tmp/slice
            cp -r /app/packages/airport/${{ matrix.function }} /tmp/slice/${{ matrix.function }}
            rm -rf /tmp/slice/${{ matrix.function }}/lib /tmp/slice/${{ matrix.function }}/node_modules
            /tmp/slice/${{ matrix.function }}/build.sh
            test -f /tmp/slice/${{ matrix.function }}/lib/function.js
            test ! -e /tmp/slice/${{ matrix.function }}/node_modules/jest
            test ! -e /tmp/slice/${{ matrix.function }}/node_modules/@biomejs
          '
  infra:
    if: github.actor != 'dependabot[bot]'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Set up Node.js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 'Bundle the function'
        working-directory: 'packages/airport/pull'
        run: 'npm ci --no-audit --no-fund && npm run bundle'
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: 'Set up OpenTofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: 'infra/.opentofu-version'
          tofu_wrapper: false
      - name: 'Initialize OpenTofu'
        run: 'tofu -chdir=infra init -input=false'
      - name: 'Check formatting'
        run: 'tofu -chdir=infra fmt -check -diff'
      - name: 'Plan infrastructure changes'
        run: 'tofu -chdir=infra plan -input=false -lock-timeout=10m -out=tfplan'
      - name: 'Report the plan'
        if: always()
        continue-on-error: true
        uses: gi-org-pl/report-tofu-plan-action@3e9723344bbd1c09659e14bf34be192d8db84213 # v1.0.1
        with:
          working-directory: 'infra'
